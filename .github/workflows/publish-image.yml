# Builds the GPU worker image and publishes it to ghcr.io/domainersuite/transcriber-gpu. The package
# is public so a rented GPU pod can pull it without credentials; the image contains no secrets
# (.dockerignore lets only worker.py and entrypoint.sh into the build). Never on pull_request.
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/domainersuite/transcriber-gpu

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The PyTorch base plus the baked whisper model need more free disk than a runner has.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min
